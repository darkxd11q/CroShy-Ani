<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sunucu (Admin) Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- SORU HAZIRLAMA -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">⚙️ Yayıncıya Soru Hazırla</h2>
            <input type="text" id="soru" placeholder="Soruyu Buraya Yaz..." class="w-full bg-gray-700 p-3 rounded mb-3 outline-none">
            <input type="text" id="siklar" placeholder="Şıklar (Virgülle ayır: A,B,C,D)" class="w-full bg-gray-700 p-3 rounded mb-3 outline-none">
            <input type="text" id="ipucu" placeholder="Varsa İpucu Metni" class="w-full bg-gray-700 p-3 rounded mb-3 outline-none">
            
            <div class="flex gap-2 mb-4">
                <input type="number" id="dogruCevap" placeholder="Doğru Şık (1, 2, 3...)" class="w-1/3 bg-gray-700 p-3 rounded outline-none">
                <input type="number" id="fiyat" placeholder="Ödül (TL)" class="w-1/3 bg-gray-700 p-3 rounded outline-none">
                <input type="number" id="sure" placeholder="Süre (Saniye)" class="w-1/3 bg-gray-700 p-3 rounded outline-none">
            </div>
            
            <button onclick="sirayaEkle()" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded font-bold text-lg">Sıraya Ekle</button>
        </div>

        <!-- CANLI YAYIN KONTROLÜ -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 flex flex-col">
            <h2 class="text-2xl font-bold mb-4 text-green-400">🔴 Canlı Yönetim</h2>
            
            <div id="yayinciCevapAlani" class="bg-gray-900 border border-gray-600 p-4 rounded-lg mb-4 text-center hidden">
                <p class="text-gray-400 mb-2">Yayıncının Seçtiği Cevap:</p>
                <p id="gelenCevapMetni" class="text-3xl font-bold text-blue-400 animate-pulse">Bekleniyor...</p>
            </div>

            <div class="space-y-3 mt-auto">
                <button onclick="ipucuGoster()" id="btnIpucu" class="w-full bg-indigo-600 hover:bg-indigo-500 p-4 rounded-xl font-bold text-lg hidden shadow-lg">💡 Yayıncıya İpucu Ver</button>
                <button onclick="cevabiGoster()" id="btnCevapGoster" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black p-4 rounded-xl font-bold text-lg hidden shadow-lg">🎯 Doğru Cevabı Göster & Bitir</button>
            </div>
        </div>

        <!-- KUYRUK -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 md:col-span-2">
            <h2 class="text-2xl font-bold mb-4 text-purple-400">📋 Sıradaki Sorular</h2>
            <div id="kuyrukListesi" class="space-y-3"></div>
        </div>

    </div>

    <script>
        const socket = io();
        let soruKuyrugu = [];
        let yayindakiSoruIndex = null;

        function sirayaEkle() {
            const soru = document.getElementById('soru').value.trim();
            const siklar = document.getElementById('siklar').value.split(',').map(s => s.trim()).filter(s => s !== "");
            const ipucu = document.getElementById('ipucu').value.trim();
            const dogruCevapGirdi = document.getElementById('dogruCevap').value;
            const fiyat = document.getElementById('fiyat').value;
            const sure = document.getElementById('sure').value;

            // Hata Kontrolleri
            if(!soru) return alert("Soru metni boş olamaz!");
            if(siklar.length < 2) return alert("En az 2 şık girmelisin! (Virgülle ayırarak)");
            if(!dogruCevapGirdi || dogruCevapGirdi < 1 || dogruCevapGirdi > siklar.length) return alert("Geçerli bir doğru şık numarası gir!");

            const dogruCevap = parseInt(dogruCevapGirdi) - 1; 

            soruKuyrugu.push({ soru, siklar, ipucu, dogruCevap, fiyat, sure: sure ? parseFloat(sure) : null });
            kuyruguGuncelle();
            
            // Temizlik
            document.querySelectorAll('input').forEach(i => i.value = '');
        }

        function kuyruguGuncelle() {
            const liste = document.getElementById('kuyrukListesi');
            liste.innerHTML = '';
            soruKuyrugu.forEach((item, index) => {
                liste.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-700 p-4 rounded-lg">
                        <div>
                            <span class="font-bold text-lg">${index + 1}. Soru:</span> ${item.soru} <br>
                            <span class="text-gray-300 text-sm">Doğru Şık: ${item.dogruCevap + 1} | Ödül: ${item.fiyat || 0} TL</span>
                        </div>
                        <button onclick="yayinaAl(${index})" class="bg-purple-600 hover:bg-purple-500 px-6 py-2 rounded font-bold">Yayına Gönder</button>
                    </div>`;
            });
        }

        function yayinaAl(index) {
            yayindakiSoruIndex = index;
            socket.emit('admin_soru_yayinla', soruKuyrugu[index]);
            
            // Paneli sıfırla ve butonları aç
            document.getElementById('yayinciCevapAlani').classList.remove('hidden');
            document.getElementById('gelenCevapMetni').innerText = "Bekleniyor...";
            document.getElementById('gelenCevapMetni').className = "text-3xl font-bold text-gray-500 animate-pulse";
            document.getElementById('btnCevapGoster').classList.remove('hidden');
            
            if(soruKuyrugu[index].ipucu) {
                document.getElementById('btnIpucu').classList.remove('hidden');
            } else {
                document.getElementById('btnIpucu').classList.add('hidden');
            }
        }

        function ipucuGoster() { socket.emit('admin_ipucu_goster'); }
        function cevabiGoster() { socket.emit('admin_cevabi_goster'); }

        // Yayıncı cevap verdiğinde tetiklenir
        socket.on('admin_canli_cevap_gor', (cevapMetni) => {
            const cevapEkrani = document.getElementById('gelenCevapMetni');
            cevapEkrani.innerText = cevapMetni;
            cevapEkrani.className = "text-4xl font-extrabold text-blue-400";
        });
    </script>
</body>
</html>
